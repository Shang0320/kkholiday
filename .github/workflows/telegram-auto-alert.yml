name: Automatic Telegram Alert

on:
  workflow_dispatch:
    inputs:
      alert_slot:
        description: 'Slot whose countdown reached zero'
        required: true
        type: choice
        default: slot_1
        options:
          - slot_1
          - slot_2
      quiet_hours_enabled:
        description: 'Respect the 23:00-08:00 quiet-hours switch'
        required: true
        type: boolean
        default: true
      target_code:
        description: 'Group code selected on the phone'
        required: true
        type: string
      target_date:
        description: 'Departure date selected on the phone'
        required: true
        type: string
      min_available_seats:
        description: 'Threshold selected on the phone'
        required: true
        type: string
      comparison_operator:
        description: 'Comparison operator selected on the phone'
        required: true
        type: string
      slot_label:
        description: 'Slot label shown on the phone'
        required: true
        type: string

permissions:
  contents: read

jobs:
  send-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Recheck KKHoliday and send automatic Telegram alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PREVIOUS_STATUS_URL: https://shang0320.github.io/kkholiday/data/status.json
          SEND_AUTO_TELEGRAM: 'true'
          AUTO_NOTIFY_SLOT: ${{ inputs.alert_slot }}
          AUTO_QUIET_HOURS_ENABLED: ${{ inputs.quiet_hours_enabled }}
          AUTO_TARGET_CODE: ${{ inputs.target_code }}
          AUTO_TARGET_DATE: ${{ inputs.target_date }}
          AUTO_MIN_AVAILABLE_SEATS: ${{ inputs.min_available_seats }}
          AUTO_COMPARISON_OPERATOR: ${{ inputs.comparison_operator }}
          AUTO_SLOT_LABEL: ${{ inputs.slot_label }}
        run: node scripts/monitor.js
