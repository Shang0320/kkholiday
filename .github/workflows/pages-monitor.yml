name: KKHoliday Monitor and GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      force_notify:
        description: '若目前符合門檻，是否強制測試 Telegram 推播'
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  monitor-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch KKHoliday and prepare status snapshot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PREVIOUS_STATUS_URL: https://shang0320.github.io/kkholiday/data/status.json
          FORCE_NOTIFY: ${{ inputs.force_notify || 'false' }}
        run: node scripts/monitor.js

      - name: Build static GitHub Pages site
        env:
          NEXT_PUBLIC_BASE_PATH: /kkholiday
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
