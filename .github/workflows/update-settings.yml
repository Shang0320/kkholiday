name: Update Monitor Settings

on:
  workflow_dispatch:
    inputs:
      quiet_hours_enabled:
        description: '23:00-08:00 Telegram quiet hours'
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

jobs:
  update-settings:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update quiet-hours setting
        env:
          QUIET_HOURS_ENABLED: ${{ inputs.quiet_hours_enabled }}
        run: node scripts/update-config.js

      - name: Commit setting when changed
        run: |
          if git diff --quiet -- config.json; then
            echo "Setting already matches the requested value."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.json
          git commit -m "Set Telegram quiet hours to ${{ inputs.quiet_hours_enabled }}"
          git push origin HEAD:main

      - name: Refresh monitor and GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages-monitor.yml --ref main -f force_notify=false
